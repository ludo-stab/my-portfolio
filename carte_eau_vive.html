<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carte interactive - Sections eau vive</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />

<style>
  /* ===== Page / app shell ===== */
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  }

  #appContainer {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  /* ===== Sidebar shell (header + search box + scrollable list) ===== */
  #sidebar {
    width: 340px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    border-right: 1px solid #d6d6d6;
    box-sizing: border-box;
  }

  #sidebarHeader {
    padding: 14px 16px 10px 16px;
    border-bottom: 1px solid #e2e2e2;
  }

  #sidebarHeader h1 {
    font-size: 16px;
    margin: 0 0 6px 0;
    color: #1a3c34;
  }

  #sidebarHeader p {
    font-size: 12px;
    color: #666;
    margin: 0 0 8px 0;
  }

  #searchBox {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 10px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  #siteCount {
    font-size: 11px;
    color: #888;
    margin-top: 6px;
  }

  #siteList {
    flex: 1;
    overflow-y: auto;
  }

  .region-group {
    border-bottom: 1px solid #eee;
  }

  /* ===== Sidebar: région group headers (click to filter/expand) ===== */
  .region-header {
    padding: 10px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 13px;
    color: #1a3c34;
    background: #fafafa;
  }

  .region-header:hover {
    background: #f2f8f5;
  }

  .region-header.active {
    background: #e3f1ea;
  }

  .region-title {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .region-arrow {
    display: inline-block;
    font-size: 10px;
    transition: transform 0.15s ease;
    color: #666;
  }

  .region-header.active .region-arrow {
    transform: rotate(90deg);
  }

  .region-count {
    font-size: 11px;
    color: #888;
    font-weight: 400;
  }

  .region-sites {
    display: none;
  }

  .region-sites.expanded {
    display: block;
  }

  /* ===== Sidebar: individual section (site) rows ===== */
  .site-item {
    padding: 9px 16px 9px 30px;
    border-bottom: 1px solid #f1f1f1;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .site-item:hover {
    background: #f2f8f5;
  }

  .site-item.active {
    background: #e3f1ea;
    border-left: 3px solid #238c20;
    padding-left: 27px;
  }

  .site-name {
    font-size: 13px;
    font-weight: 600;
    color: #1a3c34;
    margin-bottom: 2px;
  }

  .site-meta {
    font-size: 11.5px;
    color: #666;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10.5px;
    font-weight: 600;
    background: #eef1ea;
    color: #3b6d11;
  }

  .badge.closed {
    background: #fcebeb;
    color: #a32d2d;
  }

  .badge.access {
    background: #faeeda;
    color: #854f0b;
  }

  .badge.optimal {
    background: #e1eefc;
    color: #185fa5;
  }

  .badge.characteristic-period {
    background: #f1e6fa;
    color: #6a3d99;
  }

  .badge.characteristic-style {
    background: #eef2f7;
    color: #3d5266;
  }

  .badge.characteristic-duree {
    background: #dff5f0;
    color: #1a6f5c;
  }

  .site-empty, .site-loading {
    padding: 20px 16px;
    font-size: 13px;
    color: #888;
    text-align: center;
  }

  /* ===== Map area + Leaflet popup styling ===== */
  #mapViewDiv {
    flex: 1;
    position: relative;
  }

  /* ===== Info sheet: static panel pinned top-right of the map,
     replacing the old Leaflet popup that followed the clicked point. ===== */
  #infoPanel {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 300px;
    max-width: calc(100% - 32px);
    background: #ffffff;
    border-radius: 3px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.28);
    z-index: 1000;
    font-size: 13px;
    line-height: 1.5;
    display: none;
    overflow: hidden;
  }

  #infoPanel.visible {
    display: block;
  }

  #infoPanel .info-panel-close {
    position: absolute;
    top: 8px;
    right: 8px;
    border: none;
    background: rgba(255,255,255,0.18);
    border-radius: 3px;
    width: 24px;
    height: 24px;
    font-size: 16px;
    line-height: 1;
    color: rgba(255,255,255,0.9);
    cursor: pointer;
    z-index: 2;
  }

  #infoPanel .info-panel-close:hover {
    background: rgba(255,255,255,0.32);
    color: #ffffff;
  }

  #infoPanel .info-panel-content {
    padding: 0;
  }

  /* Header band: gives the section name its own contrasting "title bar"
     instead of blending into the rest of the sheet. */
  #infoPanel .sheet-header {
    background: #1a3c34;
    padding: 16px 36px 14px 18px;
  }

  #infoPanel .sheet-title {
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.3;
  }

  #infoPanel .sheet-subtitle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 3px;
  }

  #infoPanel .sheet-subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.75);
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #infoPanel .sheet-subtitle-row .badge {
    flex-shrink: 0;
  }

  #infoPanel .sheet-content {
    padding: 14px 18px 16px 18px;
  }

  #infoPanel .sheet-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #infoPanel .sheet-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }

  #infoPanel .sheet-label {
    font-size: 13px;
    font-weight: 600;
    color: #555;
    flex-shrink: 0;
  }

  #infoPanel .sheet-value {
    font-size: 14px;
    color: #111;
    text-align: right;
  }

  #infoPanel .sheet-divider {
    border-top: 1px solid #e2e2e2;
    margin: 12px 0;
  }

  #infoPanel .sheet-section-title {
    font-size: 13px;
    font-weight: 700;
    color: #1a3c34;
    margin-bottom: 8px;
  }

  #infoPanel .sheet-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  #infoPanel .sheet-hydro-placeholder {
    font-size: 12.5px;
    font-style: italic;
    color: #999;
  }

  #infoPanel .sheet-flow-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  #infoPanel .sheet-flow-value {
    font-size: 15px;
    font-weight: 700;
    color: #111;
  }

  #infoPanel .sheet-hydro-thresholds {
    font-size: 12px;
    color: #777;
    margin-top: 6px;
  }

  #infoPanel .sheet-hydro-updated {
    font-size: 11px;
    color: #aaa;
    margin-top: 6px;
  }

  /* Flow gauge: a min-max bar with an optional highlighted "optimal" zone,
     tick marks + labels at min/opt/max, and an arrow marking the current
     live débit. */
  #infoPanel .flow-gauge {
    position: relative;
    height: 34px;
    margin-top: 4px;
  }

  #infoPanel .flow-gauge-arrow {
    position: absolute;
    top: 2px;
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 9px solid #3b6d11;
    transform: translateX(-50%);
  }

  #infoPanel .flow-gauge-track {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    height: 6px;
    border-radius: 3px;
    background: #eef1ea;
  }

  #infoPanel .flow-gauge-optimal-zone {
    position: absolute;
    top: 0;
    height: 6px;
    border-radius: 3px;
    background: #b9d8f4;
  }

  #infoPanel .flow-gauge-tick {
    position: absolute;
    top: 10px;
    width: 2px;
    height: 14px;
    background: #999;
    transform: translateX(-50%);
  }

  #infoPanel .flow-gauge-tick.tick-opt {
    background: #185fa5;
  }

  #infoPanel .flow-gauge-tick-label {
    position: absolute;
    top: 24px;
    font-size: 10.5px;
    color: #777;
    white-space: nowrap;
  }

  .leaflet-interactive:focus {
    /* Suppresses the browser's default focus rectangle that would
       otherwise appear around a clicked polyline/marker. */
    outline: none;
  }

  /* ===== Map markers: single-site dot, its highlighted state, and the
     cluster bubble (with its own highlighted state for hover-from-list) ===== */
  .site-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #238c20;
    border: 2px solid #ffffff;
    box-shadow: 0 0 2px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  .site-dot-highlight {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #e8590c;
    border: 3px solid #ffffff;
    box-shadow: 0 0 6px rgba(0,0,0,0.7);
    cursor: pointer;
  }

  .cluster-dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #238c20;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    border: 2px solid #ffffff;
    box-shadow: 0 0 2px rgba(0,0,0,0.5);
    transition: transform 0.1s ease;
  }

  .cluster-dot.cluster-dot-highlight {
    background: #e8590c;
    box-shadow: 0 0 8px rgba(232, 89, 12, 0.85);
    transform: scale(1.15);
  }
</style>
</head>
<body>

<div id="appContainer">

  <div id="sidebar">
    <div id="sidebarHeader">
      <h1>Sections eau vive</h1>
      <p>Cliquez sur une region pour filtrer ses sites, ou sur un site pour le localiser.</p>
      <input type="text" id="searchBox" placeholder="Rechercher un nom de riviere ou de section..." />
      <div id="siteCount"></div>
    </div>
    <div id="siteList">
      <div class="site-loading">Chargement des sites...</div>
    </div>
  </div>

  <div id="mapViewDiv">
    <div id="infoPanel">
      <button type="button" class="info-panel-close" aria-label="Fermer">&times;</button>
      <div class="info-panel-content"></div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

<script>
  // ===================================================================
  // DATA SOURCES
  // ===================================================================
  const FEATURE_SERVICE_URL = "https://services8.arcgis.com/DxiA7PucIZzprCzK/arcgis/rest/services/Carte_interactive_EVQ_view/FeatureServer";
  const EAU_VIVE_LAYER_ID = 17;

  const ADMIN_REGIONS_URL = "https://servicescarto.mern.gouv.qc.ca/pes/rest/services/Territoire/SDA_WMS/MapServer/0/query?where=1%3D1&outFields=*&f=geojson&outSR=4326";

  // Public real-time hydrometric feed (Vigilance - Securite civile, MSP),
  // aggregating CEHQ/ECCC/other providers' latest débit (m3/s) and niveau
  // (m) per station. Keyed by station number, matched against STAT_HYDRO.
  const HYDRO_STATIONS_URL = "https://geoegl.msp.gouv.qc.ca/apis/mapserver-vigilance/ws/vigilance.fcgi?service=wfs&version=1.1.0&request=getfeature&typename=stations_igo2_public&outputformat=geojson&srsName=epsg:4326";

  // ===================================================================
  // CONFIGURATION — thresholds, colors, bounds. Edit here for tweaks.
  // ===================================================================
  const NO_REGION_KEY = "__NONE__";
  // Zoom level at which the individual river-section lines start being drawn
  // (below this, only the clustered dot markers show).
  const LINE_ZOOM_THRESHOLD = 9;
  // Zoom level at which the dot markers finally disappear. Keeping this a
  // bit higher than LINE_ZOOM_THRESHOLD creates an overlap zone where both
  // markers and lines are visible together, instead of an abrupt swap.
  const MARKER_ZOOM_THRESHOLD = LINE_ZOOM_THRESHOLD + 2;
  // Colors used throughout: river-section lines/dots, the orange highlight
  // (hover + selection), and the blue région boundary outline.
  const LINE_COLOR = "#238c20";
  const HIGHLIGHT_COLOR = "#e8590c";
  const BOUNDARY_COLOR = "#185fa5";
  const ZOOM_DURATION = 1.4;

  // Région polygon appearance for each state (see applyRegionStyles below):
  // untouched, hovered in the sidebar, the one currently selected/filtered,
  // and the others dimmed out while a région is selected.
  const REGION_STYLE_NONE = { color: BOUNDARY_COLOR, weight: 0, opacity: 0, fillColor: BOUNDARY_COLOR, fillOpacity: 0 };
  const REGION_STYLE_HOVER = { color: BOUNDARY_COLOR, weight: 2, opacity: 0.9, fillColor: BOUNDARY_COLOR, fillOpacity: 0.45 };
  const REGION_STYLE_SELECTED = { color: BOUNDARY_COLOR, weight: 3, opacity: 1, fillColor: BOUNDARY_COLOR, fillOpacity: 0 };
  const REGION_STYLE_DIMMED = { color: "#2a2a2a", weight: 0, opacity: 0, fillColor: "#1a1a1a", fillOpacity: 0.45 };

  // Rough bounding box for Quebec, used both to reject bad coordinates
  // (isValidLngLat) and as a fallback camera view when real bounds are
  // unavailable or invalid.
  const QC_LAT_MIN = 44, QC_LAT_MAX = 63.5, QC_LNG_MIN = -80, QC_LNG_MAX = -55;
  const QC_FALLBACK_BOUNDS = L.latLngBounds([QC_LAT_MIN, QC_LNG_MIN], [QC_LAT_MAX, QC_LNG_MAX]);
  const LONG_LINE_WARNING_M = 150000;

  // (ETAT_SECTN / statut is intentionally not shown - deprioritized per
  // feedback; NIV_DIFFI is the more meaningful attribute for both the
  // sidebar list and the info sheet.)

  // Column holding the paddler skill-level classification (Debutant /
  // Intermediaire / Avance / etc.) - NOT DIFF_WWG, which is the roman-
  // numeral rapid class (I-VI). Stored as a coded value (ND01..ND04).
  const SKILL_LEVEL_FIELD = "NIV_DIFFI";
  const SKILL_LEVEL_LABELS = { ND01: "D\u00E9butant", ND02: "Interm\u00E9diaire", ND03: "Avanc\u00E9", ND04: "Expert" };
  const SKILL_LEVEL_BADGE_CLASSES = { ND01: "badge", ND02: "badge access", ND03: "badge closed", ND04: "badge closed" };

  // "Caracteristiques" badges: river-style flags (shown only when truthy)
  // plus two free-text fields shown as-is when present. Each gets a
  // "category" so the badges can be color-coded by group in the sheet.
  // Coded values for DUREE_WEB -> display label.
  const DUREE_WEB_LABELS = {
    SITE: "Site de pratique",
    LAPS: "Laps",
    TWDY: "Twice a day",
    WHLD: "Whole day",
    OVNG: "Overnight",
    MULT: "Multiday"
  };

  const CHARACTERISTIC_FIELDS = [
    { field: "PERIOD_PAGAY", type: "text", category: "period" },
    { field: "DUREE_WEB", type: "coded", labels: DUREE_WEB_LABELS, category: "duree" },
    { field: "CREEKING", type: "flag", label: "Creeking", category: "style" },
    { field: "BIG_WATER", type: "flag", label: "Big water", category: "style" },
    { field: "CONTINUOUS", type: "flag", label: "Continu", category: "style" },
    { field: "POOL_DROP", type: "flag", label: "Pool-drop", category: "style" },
    { field: "PLAYBOATING", type: "flag", label: "Playboating", category: "style" }
  ];

  // A live débit within this fraction of DEBIT_OPT counts as "optimal"
  // rather than just "praticable" (+/- 10%, as requested).
  const OPTIMAL_TOLERANCE = 0.10;

  const FLOW_STATUS_LABELS = {
    optimal: "Debit optimal",
    praticable: "Praticable",
    "trop-bas": "Trop bas",
    "niveau-eleve": "Niveau eleve"
  };

  // (icons removed per feedback - labels are plain text now)

  // ===================================================================
  // MAP INITIALIZATION
  // ===================================================================
  const map = L.map("mapViewDiv", { zoomControl: true }).setView([47, -71.5], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19
  }).addTo(map);

  // ===================================================================
  // MARKER / CLUSTER ICONS
  // ===================================================================
  function greenDotIcon() {
    return L.divIcon({
      className: "site-dot-icon",
      html: '<div class="site-dot"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });
  }

  function highlightDotIcon() {
    return L.divIcon({
      className: "site-dot-icon",
      html: '<div class="site-dot-highlight"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });
  }

  function uniformClusterIcon(cluster) {
    const count = cluster.getChildCount();
    return L.divIcon({
      className: "cluster-dot-icon",
      html: '<div class="cluster-dot">' + count + '</div>',
      iconSize: [34, 34],
      iconAnchor: [17, 17]
    });
  }

  const clusterGroup = L.markerClusterGroup({
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true,
    maxClusterRadius: 25,
    iconCreateFunction: uniformClusterIcon
  });
  const lineLayerGroup = L.layerGroup();
  const regionsLayerGroup = L.layerGroup();

  map.addLayer(regionsLayerGroup);
  map.addLayer(clusterGroup);
  map.addLayer(lineLayerGroup);

  // ===================================================================
  // MUTABLE STATE — the app's "current state" lives in these variables.
  // ===================================================================
  let highlightLine = null;         // orange overlay for the SELECTED (clicked) site
  let hoverHighlightLine = null;    // orange overlay for the HOVERED site
  let hoverHighlightedSite = null;
  let selectedHighlightedSite = null;

  const siteListEl = document.getElementById("siteList");
  const siteCountEl = document.getElementById("siteCount");
  const searchBoxEl = document.getElementById("searchBox");
  const infoPanelEl = document.getElementById("infoPanel");
  const infoPanelContentEl = infoPanelEl.querySelector(".info-panel-content");
  const infoPanelCloseEl = infoPanelEl.querySelector(".info-panel-close");

  let allSites = [];              // every site loaded from the feature service
  let regionMap = new Map();      // région code -> array of sites in it
  let regionLabels = {};          // région code -> display name
  let adminRegions = [];          // { code, name, feature, boundaryLayer } per région
  let hydroStationsMap = new Map(); // normalized station number -> { debit, niveau, dateUtc }
  let activeItemEl = null;        // currently highlighted <div> in the sidebar list
  let activeRegionCode = null;    // région currently selected/filtered (or null)
  let hoveredRegionCode = null;   // région currently hovered in the sidebar (or null)
  let searchQuery = "";

  // ===================================================================
  // GEOMETRY HELPERS
  // ===================================================================
  function isValidLngLat(c) {
    const lng = c[0], lat = c[1];
    return isFinite(lng) && isFinite(lat) &&
      lat >= QC_LAT_MIN && lat <= QC_LAT_MAX &&
      lng >= QC_LNG_MIN && lng <= QC_LNG_MAX;
  }

  function toLatLngsFiltered(coordsArray) {
    return coordsArray.filter(isValidLngLat).map(function (c) { return [c[1], c[0]]; });
  }

  function lineMidpoint(coords) {
    const idx = Math.floor(coords.length / 2);
    return coords[idx];
  }

  // ===================================================================
  // POPUP / LIST HTML BUILDERS — the section name/badges shown to users.
  // ===================================================================

  // Case-insensitive property lookup: falls back to scanning the actual
  // key names when the exact-case field name isn't present, in case a
  // column's casing differs slightly from what's configured above.
  function getPropCI(props, fieldName) {
    if (Object.prototype.hasOwnProperty.call(props, fieldName)) return props[fieldName];
    const target = fieldName.toLowerCase();
    for (const key in props) {
      if (key.toLowerCase() === target) return props[key];
    }
    return undefined;
  }

  // Loosely interprets whatever truthy convention the source data uses for
  // its boolean-style columns (1/0, oui/non, true/false, etc.).
  function isFlagTruthy(value) {
    if (value === null || value === undefined) return false;
    if (typeof value === "number") return value !== 0;
    if (typeof value === "boolean") return value;
    const s = String(value).trim().toLowerCase();
    if (s === "") return false;
    return ["0", "non", "no", "false", "n", "aucun"].indexOf(s) === -1;
  }

  // Builds the "Caracteristiques" section (river-style badges), placed
  // before Hydrologie. Returns "" (section omitted entirely) when none of
  // the configured fields have a value to show.
  function buildCharacteristicsHtml(props) {
    const badges = [];
    CHARACTERISTIC_FIELDS.forEach(function (cfg) {
      const raw = getPropCI(props, cfg.field);
      if (cfg.type === "flag") {
        if (isFlagTruthy(raw)) badges.push({ label: cfg.label, category: cfg.category });
      } else if (cfg.type === "coded") {
        if (raw !== null && raw !== undefined && String(raw).trim() !== "") {
          const code = String(raw).trim();
          badges.push({ label: cfg.labels[code] || code, category: cfg.category });
        }
      } else if (raw !== null && raw !== undefined && String(raw).trim() !== "") {
        // Free-text fields (PERIOD_PAGAY) are shown verbatim, in full - no
        // shortening of the source value.
        badges.push({ label: String(raw).trim(), category: cfg.category });
      }
    });
    if (badges.length === 0) return "";

    let html = '<div class="sheet-divider"></div>';
    html += '<div class="sheet-section-title">Caracteristiques</div>';
    html += '<div class="sheet-badges">';
    badges.forEach(function (b) {
      html += '<span class="badge characteristic-' + b.category + '">' + b.label + '</span>';
    });
    html += '</div>';
    return html;
  }

  // ===================================================================
  // HYDROLOGY — live débit lookup + comparison against the section's
  // DEBIT_MIN / DEBIT_OPT / DEBIT_MAX thresholds.
  // ===================================================================

  // CEHQ-style station numbers are zero-padded to 6 digits (e.g. "051005"),
  // but some providers in the same feed use other formats (e.g. Environment
  // Canada's "02OJ007"). Only pad when the code is purely numeric, and
  // always compare on a normalized value so "51005" and "051005" match.
  function normalizeStationCode(code) {
    if (code === null || code === undefined) return null;
    const trimmed = String(code).trim();
    if (!trimmed) return null;
    if (/^\d+$/.test(trimmed)) return trimmed.padStart(6, "0");
    return trimmed.toUpperCase();
  }

  function numOrNull(value) {
    if (value === null || value === undefined || value === "") return null;
    const n = Number(value);
    return isFinite(n) ? n : null;
  }

  // Compares a live débit to whatever thresholds the section actually has.
  // Any of min/opt/max can be missing (no significant minimum/maximum, or
  // an unknown optimum) - the comparison degrades gracefully:
  //   - within +/-10% of DEBIT_OPT              -> "optimal"
  //   - below DEBIT_MIN                          -> "trop-bas"
  //   - above DEBIT_MAX                          -> "niveau-eleve"
  //   - otherwise, if at least one threshold      -> "praticable"
  //     was available to check against
  //   - no thresholds at all to compare against  -> null (unclassified)
  function classifyFlowStatus(value, min, opt, max) {
    if (typeof value !== "number" || !isFinite(value)) return null;

    if (typeof opt === "number" && opt > 0 && Math.abs(value - opt) <= opt * OPTIMAL_TOLERANCE) {
      return "optimal";
    }
    if (typeof min === "number" && value < min) return "trop-bas";
    if (typeof max === "number" && value > max) return "niveau-eleve";
    if (typeof min === "number" || typeof max === "number" || typeof opt === "number") {
      return "praticable";
    }
    return null;
  }

  function flowBadgeClass(status) {
    if (status === "optimal") return "badge optimal";
    if (status === "trop-bas" || status === "niveau-eleve") return "badge closed";
    return "badge";
  }

  function formatHydroDate(isoUtc) {
    try {
      return new Date(isoUtc).toLocaleString("fr-CA", {
        timeZone: "America/Toronto",
        dateStyle: "short",
        timeStyle: "short"
      });
    } catch (e) {
      return isoUtc;
    }
  }

  // Builds the "Hydrologie" section of the info sheet: the live débit at
  // the section's station, how it stacks up against DEBIT_MIN/OPT/MAX, and
  // when that reading was taken. Falls back to a placeholder whenever a
  // station isn't known, unreachable, or reports no débit at all.
  function formatFlowNumber(n) {
    return (Math.round(n * 10) / 10).toString();
  }

  // Renders a min-max bar for the débit, with the optimal zone (if known)
  // highlighted and a round pointer marking the current live value. Only
  // drawn when both DEBIT_MIN and DEBIT_MAX are known - that's what gives
  // the bar its two ends; with either missing there's nothing solid to
  // anchor a scale to, so the caller falls back to plain text instead.
  function buildFlowGaugeHtml(min, opt, max, value, status) {
    if (min === null || max === null || max <= min) return "";

    function pct(v) {
      return Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));
    }

    let optZoneHtml = "";
    let optTickHtml = "";
    let optLabelHtml = "";
    if (opt !== null) {
      const zoneLowPct = pct(opt - opt * OPTIMAL_TOLERANCE);
      const zoneHighPct = pct(opt + opt * OPTIMAL_TOLERANCE);
      optZoneHtml = '<div class="flow-gauge-optimal-zone" style="left:' + zoneLowPct.toFixed(1) + '%; width:' + Math.max(0, zoneHighPct - zoneLowPct).toFixed(1) + '%;"></div>';

      const optPct = pct(opt);
      optTickHtml = '<div class="flow-gauge-tick tick-opt" style="left:' + optPct.toFixed(1) + '%;"></div>';
      optLabelHtml = '<div class="flow-gauge-tick-label" style="left:' + optPct.toFixed(1) + '%; transform:translateX(-50%);">Opt ' + formatFlowNumber(opt) + '</div>';
    }

    const pointerColor = status === "optimal" ? "#185fa5" : ((status === "trop-bas" || status === "niveau-eleve") ? "#a32d2d" : "#3b6d11");
    const valuePct = pct(value);

    let html = '<div class="flow-gauge">';
    // Arrow marking the live débit, pointing down onto the track.
    html += '<div class="flow-gauge-arrow" style="left:' + valuePct.toFixed(1) + '%; border-top-color:' + pointerColor + ';"></div>';
    html += '<div class="flow-gauge-track">' + optZoneHtml + '</div>';
    // Ticks + labels for the three thresholds: min and max sit at the
    // track's ends, opt (when known) at its computed position in between.
    html += '<div class="flow-gauge-tick" style="left:0%;"></div>';
    html += optTickHtml;
    html += '<div class="flow-gauge-tick" style="left:100%;"></div>';
    html += '<div class="flow-gauge-tick-label" style="left:0%; transform:translateX(0%);">Min ' + formatFlowNumber(min) + '</div>';
    html += optLabelHtml;
    html += '<div class="flow-gauge-tick-label" style="left:100%; transform:translateX(-100%);">Max ' + formatFlowNumber(max) + '</div>';
    html += '</div>';
    return html;
  }

  function buildHydrologyHtml(props) {
    const station = hydroStationsMap.get(normalizeStationCode(props.STAT_HYDRO));
    const debit = station ? numOrNull(station.debit) : null;

    let html = '<div class="sheet-section-title">Hydrologie</div>';

    if (debit === null) {
      html += '<div class="sheet-hydro-placeholder">Aucune donnee sur les debits</div>';
      return html;
    }

    const min = numOrNull(props.DEBIT_MIN);
    const opt = numOrNull(props.DEBIT_OPT);
    const max = numOrNull(props.DEBIT_MAX);
    const status = classifyFlowStatus(debit, min, opt, max);

    // Value and practicability on the same line, so they read as one fact.
    html += '<div class="sheet-flow-line">';
    html += '<span class="sheet-flow-value">' + debit.toFixed(2) + ' m' + '\u00B3' + '/s</span>';
    if (status) {
      html += '<span class="' + flowBadgeClass(status) + '">' + FLOW_STATUS_LABELS[status] + '</span>';
    }
    html += '</div>';

    const gaugeHtml = buildFlowGaugeHtml(min, opt, max, debit, status);
    if (gaugeHtml) {
      html += gaugeHtml;
    } else {
      const thresholdParts = [];
      if (min !== null) thresholdParts.push("min " + min);
      if (opt !== null) thresholdParts.push("opt " + opt);
      if (max !== null) thresholdParts.push("max " + max);
      if (thresholdParts.length > 0) {
        html += '<div class="sheet-hydro-thresholds">Seuils (m' + '\u00B3' + '/s) : ' + thresholdParts.join(" / ") + '</div>';
      }
    }

    if (station.dateUtc) {
      html += '<div class="sheet-hydro-updated">Mise a jour : ' + formatHydroDate(station.dateUtc) + '</div>';
    }

    return html;
  }

  function buildPopupHtml(site) {
    const props = site.properties;
    const name = props.NOM || props.NOM_PLN_EAU || "Section sans nom";
    const river = props.NOM_PLN_EAU || "";
    const region = regionLabels[site._regionCode] || "Region non determinee";
    const skillCode = getPropCI(props, SKILL_LEVEL_FIELD);
    const skillLabel = skillCode ? (SKILL_LEVEL_LABELS[skillCode] || skillCode) : null;

    let html = '<div class="sheet">';

    // Header band: section name as title; plan d'eau as subtitle with the
    // skill-level badge to its right - on its own contrasting background
    // so it reads as a title bar rather than blending into the sheet.
    html += '<div class="sheet-header">';
    html += '<div class="sheet-title">' + name + '</div>';
    if (river || skillLabel) {
      html += '<div class="sheet-subtitle-row">';
      html += '<span class="sheet-subtitle">' + river + '</span>';
      if (skillLabel) {
        html += '<span class="' + (SKILL_LEVEL_BADGE_CLASSES[skillCode] || "badge optimal") + '">' + skillLabel + '</span>';
      }
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="sheet-content">';

    // Body: key characteristics as label/value rows.
    html += '<div class="sheet-body">';
    html += '<div class="sheet-row"><span class="sheet-label">Region</span><span class="sheet-value">' + region + '</span></div>';
    if (props.DIFF_WWG) {
      html += '<div class="sheet-row"><span class="sheet-label">Classe</span><span class="sheet-value">' + props.DIFF_WWG + '</span></div>';
    }
    if (props.LONGU) {
      html += '<div class="sheet-row"><span class="sheet-label">Longueur</span><span class="sheet-value">' + Number(props.LONGU).toFixed(1) + ' km</span></div>';
    }
    html += '</div>';

    html += buildCharacteristicsHtml(props);

    html += '<div class="sheet-divider"></div>';
    html += buildHydrologyHtml(props);

    html += '</div>'; // .sheet-content
    html += '</div>'; // .sheet
    return html;
  }

  function showInfoPanel(site) {
    infoPanelContentEl.innerHTML = buildPopupHtml(site);
    infoPanelEl.classList.add("visible");
  }

  function hideInfoPanel() {
    infoPanelEl.classList.remove("visible");
  }

  infoPanelCloseEl.addEventListener("click", function (e) {
    e.stopPropagation();
    deselectSite();
  });

  // Prevent clicks inside the panel (e.g. selecting text) from bubbling to
  // the map and triggering deselectSite().
  infoPanelEl.addEventListener("click", function (e) {
    e.stopPropagation();
  });

  function siteItemHtml(site) {
    const props = site.properties;
    const name = props.NOM || props.NOM_PLN_EAU || "Section sans nom";
    const river = props.NOM_PLN_EAU || "";
    const diff = props.DIFF_WWG || "";
    const length = props.LONGU;
    const skillCode = getPropCI(props, SKILL_LEVEL_FIELD);
    const skillLabel = skillCode ? (SKILL_LEVEL_LABELS[skillCode] || skillCode) : "";

    let metaHtml = "";
    if (river) metaHtml += "<span>" + river + "</span>";
    if (length) metaHtml += "<span>" + Number(length).toFixed(1) + " km</span>";
    if (skillLabel) metaHtml += '<span class="' + (SKILL_LEVEL_BADGE_CLASSES[skillCode] || "badge optimal") + '">' + skillLabel + "</span>";

    const nameHtml = name + (diff ? ' <span class="badge">' + diff + "</span>" : "");

    return '<div class="site-name">' + nameHtml + '</div><div class="site-meta">' + metaHtml + '</div>';
  }

  function attachSiteClick(item, site) {
    item.dataset.objectid = site.properties.OBJECTID;
    item.addEventListener("click", function (e) {
      e.stopPropagation();
      focusSite(site);
    });
    item.addEventListener("mouseenter", function () {
      showHoverHighlight(site);
    });
    item.addEventListener("mouseleave", function () {
      clearHoverHighlight();
    });
  }

  // ===================================================================
  // SIDEBAR LIST RENDERING — grouped-by-région view (default) and the
  // flat view used while searching.
  // ===================================================================
  function renderGroupedList() {
    siteListEl.innerHTML = "";

    if (allSites.length === 0) {
      siteListEl.innerHTML = '<div class="site-empty">Aucun site trouve.</div>';
      return;
    }

    const sortedCodes = Array.from(regionMap.keys()).sort(function (a, b) {
      const labelA = regionLabels[a] || "Region non determinee";
      const labelB = regionLabels[b] || "Region non determinee";
      return labelA.localeCompare(labelB);
    });

    sortedCodes.forEach(function (code) {
      const sites = regionMap.get(code);
      const label = regionLabels[code] || "Region non determinee";

      const group = document.createElement("div");
      group.className = "region-group";
      group.dataset.region = code;

      const header = document.createElement("div");
      header.className = "region-header";
      if (code === activeRegionCode) header.classList.add("active");
      header.innerHTML =
        '<span class="region-title"><span class="region-arrow">&#9656;</span>' + label + '</span>' +
        '<span class="region-count">' + sites.length + (sites.length > 1 ? " sections" : " section") + '</span>';

      const sitesContainer = document.createElement("div");
      sitesContainer.className = "region-sites";
      if (code === activeRegionCode) sitesContainer.classList.add("expanded");

      sites.forEach(function (site) {
        const item = document.createElement("div");
        item.className = "site-item";
        item.innerHTML = siteItemHtml(site);
        attachSiteClick(item, site);
        sitesContainer.appendChild(item);
      });

      header.addEventListener("click", function () {
        toggleRegion(code);
      });

      header.addEventListener("mouseenter", function () {
        hoveredRegionCode = code;
        applyRegionStyles();
      });

      header.addEventListener("mouseleave", function () {
        hoveredRegionCode = null;
        applyRegionStyles();
      });

      group.appendChild(header);
      group.appendChild(sitesContainer);
      siteListEl.appendChild(group);
    });
  }

  function renderFlatList(sites) {
    siteListEl.innerHTML = "";

    if (sites.length === 0) {
      siteListEl.innerHTML = '<div class="site-empty">Aucun site ne correspond a la recherche.</div>';
      return;
    }

    sites.forEach(function (site) {
      const item = document.createElement("div");
      item.className = "site-item";
      item.style.paddingLeft = "16px";
      item.innerHTML = siteItemHtml(site);
      attachSiteClick(item, site);
      siteListEl.appendChild(item);
    });
  }

  function setMarkerHighlighted(site, on) {
    if (!site || !site._marker) return;
    site._marker.setIcon(on ? highlightDotIcon() : greenDotIcon());
  }

  // ===================================================================
  // HIGHLIGHT / SELECTION — two independent highlight "layers":
  //   - the SELECTED site (clicked, stays highlighted until deselected)
  //   - the HOVERED site (temporary, follows the mouse)
  // Both can highlight the marker icon, an orange overlay line, and (if
  // the marker is folded into a cluster) the cluster bubble itself.
  // ===================================================================
  function clearHighlight() {
    if (highlightLine) {
      map.removeLayer(highlightLine);
      highlightLine = null;
    }
    if (selectedHighlightedSite && selectedHighlightedSite !== hoverHighlightedSite) {
      setMarkerHighlighted(selectedHighlightedSite, false);
    }
    selectedHighlightedSite = null;
  }

  function deselectSite() {
    clearHighlight();
    hideInfoPanel();
    if (activeItemEl) {
      activeItemEl.classList.remove("active");
      activeItemEl = null;
    }
    if (activeRegionCode !== null) {
      activeRegionCode = null;
      refreshDisplay();
      applyRegionStyles();
      renderGroupedList();
      // Deliberately no camera movement here — deselecting should leave
      // the current view (position/zoom) exactly as it is.
    }
  }

  map.on("click", deselectSite);

  // If a site's marker is currently folded into a cluster bubble, give that
  // bubble a highlight style (no zooming/spiderfying) so hovering the
  // section in the list still shows something on the map.
  let highlightedClusterEl = null;

  function setClusterHighlight(site, on) {
    if (!site || !clusterGroup.hasLayer(site._marker)) return;
    const visibleParent = clusterGroup.getVisibleParent(site._marker);
    if (!visibleParent || visibleParent === site._marker || typeof visibleParent.getElement !== "function") return;
    const el = visibleParent.getElement();
    const dot = el && el.querySelector(".cluster-dot");
    if (!dot) return;
    if (on) {
      dot.classList.add("cluster-dot-highlight");
      highlightedClusterEl = dot;
    } else if (highlightedClusterEl === dot) {
      dot.classList.remove("cluster-dot-highlight");
      highlightedClusterEl = null;
    }
  }

  function clearClusterHighlight() {
    if (highlightedClusterEl) {
      highlightedClusterEl.classList.remove("cluster-dot-highlight");
      highlightedClusterEl = null;
    }
  }

  function showHoverHighlight(site) {
    clearHoverHighlight();
    hoverHighlightLine = L.polyline(site._line.getLatLngs(), {
      color: HIGHLIGHT_COLOR,
      weight: 5,
      opacity: 0.85,
      interactive: false
    }).addTo(map);
    hoverHighlightedSite = site;
    setMarkerHighlighted(site, true);
    setClusterHighlight(site, true);
  }

  function clearHoverHighlight() {
    if (hoverHighlightLine) {
      map.removeLayer(hoverHighlightLine);
      hoverHighlightLine = null;
    }
    if (hoverHighlightedSite && hoverHighlightedSite !== selectedHighlightedSite) {
      setMarkerHighlighted(hoverHighlightedSite, false);
    }
    clearClusterHighlight();
    hoverHighlightedSite = null;
  }

  // ===================================================================
  // REGION POLYGON STYLING
  // ===================================================================
  function applyRegionStyles() {
    adminRegions.forEach(function (region) {
      let style;
      if (region.code === activeRegionCode) {
        style = REGION_STYLE_SELECTED;
      } else if (activeRegionCode) {
        style = REGION_STYLE_DIMMED;
      } else if (region.code === hoveredRegionCode) {
        style = REGION_STYLE_HOVER;
      } else {
        style = REGION_STYLE_NONE;
      }
      region.boundaryLayer.setStyle(style);
    });
  }

  // ===================================================================
  // BOUNDS / CAMERA HELPERS — wrapped in try/catch so a malformed
  // geometry can never throw mid-way through a click handler and skip
  // the rest of it (e.g. leaving the sidebar list expanded).
  // ===================================================================
  function safeGroupBounds(group, fallback) {
    try {
      return group.getLayers().length > 0 ? group.getBounds() : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function safeLayerBounds(layer, fallback) {
    try {
      return layer.getBounds();
    } catch (e) {
      return fallback;
    }
  }

  function boundsForSites(sites, fallback) {
    if (!sites || sites.length === 0) return fallback;
    const allBounds = sites.map(function (s) { return s._line.getBounds(); });
    let combined = allBounds[0];
    for (let i = 1; i < allBounds.length; i++) combined.extend(allBounds[i]);
    return combined;
  }

  function boundsForLine(site) {
    const bounds = site._line.getBounds();
    const diagonal = bounds.getNorthWest().distanceTo(bounds.getSouthEast());
    if (diagonal > LONG_LINE_WARNING_M) {
      console.warn("Section de " + Math.round(diagonal / 1000) + " km, ajustement du zoom pour montrer la ligne complete:", site.properties.NOM || site.properties.OBJECTID);
    }
    return bounds;
  }

  // ===================================================================
  // FILTERING & VISIBILITY — what's currently shown, driven by search
  // text, the selected région, and the current zoom (see refreshDisplay).
  // ===================================================================
  function siteMatchesSearch(site) {
    if (!searchQuery) return false;
    const name = (site.properties.NOM || "").toLowerCase();
    const river = (site.properties.NOM_PLN_EAU || "").toLowerCase();
    return name.includes(searchQuery) || river.includes(searchQuery);
  }

  function isSiteVisible(site) {
    if (searchQuery) return siteMatchesSearch(site);
    if (!activeRegionCode) return true;
    return site._regionCode === activeRegionCode;
  }

  // Decides, for every site, whether its marker and/or its line should be
  // on the map right now — based on the current zoom (see the two zoom
  // thresholds above) and whether it passes the current region/search
  // filter (isSiteVisible). Runs on every zoom change and every filter
  // change.
  function refreshDisplay() {
    const z = map.getZoom();
    const showLines = z >= LINE_ZOOM_THRESHOLD;
    const showMarkers = z < MARKER_ZOOM_THRESHOLD;
    allSites.forEach(function (site) {
      const visible = isSiteVisible(site);
      site._visible = visible;

      if (showLines && visible) {
        if (!lineLayerGroup.hasLayer(site._line)) lineLayerGroup.addLayer(site._line);
      } else if (lineLayerGroup.hasLayer(site._line)) {
        lineLayerGroup.removeLayer(site._line);
      }

      if (showMarkers && visible) {
        if (!clusterGroup.hasLayer(site._marker)) clusterGroup.addLayer(site._marker);
      } else if (clusterGroup.hasLayer(site._marker)) {
        clusterGroup.removeLayer(site._marker);
      }
    });
  }

  map.on("zoomend", refreshDisplay);

  // ===================================================================
  // USER INTERACTIONS — région selection/deselection, focusing a site
  // (from a marker, a polyline, or a sidebar click), and clearing the
  // selection when clicking empty map space.
  // ===================================================================
  function flyToBoundsSafe(bounds, extraOpts) {
    const opts = Object.assign({ padding: [40, 40], maxZoom: 11, duration: ZOOM_DURATION }, extraOpts || {});
    try {
      map.flyToBounds(bounds, opts);
    } catch (e) {
      console.warn("Deplacement de la carte impossible, position inchangee:", e);
    }
  }

  function toggleRegion(code) {
    if (activeItemEl) {
      activeItemEl.classList.remove("active");
      activeItemEl = null;
    }
    clearHighlight();
    searchQuery = "";
    searchBoxEl.value = "";

    if (activeRegionCode === code) {
      activeRegionCode = null;
      flyToBoundsSafe(safeGroupBounds(regionsLayerGroup, QC_FALLBACK_BOUNDS));
    } else {
      activeRegionCode = code;

      const region = adminRegions.find(function (r) { return r.code === code; });
      if (region) {
        flyToBoundsSafe(safeLayerBounds(region.boundaryLayer, QC_FALLBACK_BOUNDS));
      } else {
        const sites = regionMap.get(code) || [];
        flyToBoundsSafe(boundsForSites(sites, QC_FALLBACK_BOUNDS));
      }
    }
    refreshDisplay();
    applyRegionStyles();
    renderGroupedList();
  }

  function revealInList(site) {
    if (!searchQuery) {
      const groupEl = siteListEl.querySelector('.region-group[data-region="' + site._regionCode + '"]');
      if (groupEl) {
        const sitesContainer = groupEl.querySelector(".region-sites");
        const header = groupEl.querySelector(".region-header");
        if (sitesContainer && !sitesContainer.classList.contains("expanded")) {
          sitesContainer.classList.add("expanded");
          header.classList.add("active");
        }
      }
    }

    const itemEl = siteListEl.querySelector('[data-objectid="' + site.properties.OBJECTID + '"]');
    if (activeItemEl) activeItemEl.classList.remove("active");
    if (itemEl) {
      itemEl.classList.add("active");
      activeItemEl = itemEl;
      itemEl.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }

  function focusSite(site) {
    if (!searchQuery && site._regionCode !== activeRegionCode) {
      activeRegionCode = site._regionCode;
      refreshDisplay();
      applyRegionStyles();
      renderGroupedList();
    }

    revealInList(site);

    clearHighlight();
    highlightLine = L.polyline(site._line.getLatLngs(), {
      color: HIGHLIGHT_COLOR,
      weight: 6,
      opacity: 1,
      interactive: false
    }).addTo(map);
    selectedHighlightedSite = site;
    setMarkerHighlighted(site, true);

    const bounds = boundsForLine(site);
    flyToBoundsSafe(bounds, { padding: [80, 80], maxZoom: 15 });

    // Same info-sheet content/behavior regardless of whether the marker,
    // the polyline, or the sidebar list item triggered the selection.
    showInfoPanel(site);
  }

  // ===================================================================
  // REGION LOOKUP — assigns each site to a région by point-in-polygon
  // test (via turf), used once at load time to build the sidebar groups.
  // ===================================================================
  function findRegionForLatLng(latlng) {
    if (typeof turf === "undefined" || adminRegions.length === 0) return null;
    let pt;
    try {
      pt = turf.point([latlng[1], latlng[0]]);
    } catch (e) {
      return null;
    }
    for (let i = 0; i < adminRegions.length; i++) {
      try {
        if (turf.booleanPointInPolygon(pt, adminRegions[i].feature)) return adminRegions[i];
      } catch (e) {
        // ignore malformed region geometry
      }
    }
    return null;
  }

  function buildRegionMap() {
    regionMap = new Map();
    allSites.forEach(function (site) {
      const code = site._regionCode || NO_REGION_KEY;
      if (!regionMap.has(code)) regionMap.set(code, []);
      regionMap.get(code).push(site);
    });
  }

  // ===================================================================
  // DATA LOADING
  // ===================================================================
  // Fetches the administrative region polygons and draws them (dimmed,
  // non-interactive) under everything else. `adminRegions` keeps the raw
  // feature + code + rendered layer for each one, used for filtering,
  // styling, and the sidebar labels.
  function fetchAdminRegions() {
    return fetch(ADMIN_REGIONS_URL)
      .then(function (res) { return res.json(); })
      .then(function (geojson) {
        adminRegions = (geojson.features || []).map(function (f) {
          const boundaryLayer = L.geoJSON(f, { style: REGION_STYLE_NONE, interactive: false });
          const code = f.properties.RES_CO_REG;
          regionsLayerGroup.addLayer(boundaryLayer);
          return {
            code: code,
            name: f.properties.RES_NM_REG,
            feature: f,
            boundaryLayer: boundaryLayer
          };
        });
      })
      .catch(function (err) {
        console.error("Impossible de charger les regions administratives:", err);
        adminRegions = [];
      });
  }

  function fetchSites() {
    const queryUrl = FEATURE_SERVICE_URL + "/" + EAU_VIVE_LAYER_ID +
      "/query?where=1%3D1&outFields=*&f=geojson&outSR=4326";
    return fetch(queryUrl).then(function (res) { return res.json(); });
  }

  // Fetches the public real-time hydrometric feed (all providers, all of
  // Quebec) once at startup and indexes it by normalized station number,
  // so each info-sheet lookup afterwards is just a Map.get(). Non-fatal if
  // it fails or times out - sections just show "Aucune donnee sur les
  // debits" instead of live hydrology.
  function fetchHydroStations() {
    return fetch(HYDRO_STATIONS_URL)
      .then(function (res) { return res.json(); })
      .then(function (geojson) {
        hydroStationsMap = new Map();
        (geojson.features || []).forEach(function (f) {
          const code = normalizeStationCode(f.properties && f.properties.station);
          if (!code) return;
          hydroStationsMap.set(code, {
            debit: f.properties.dern_valeur_deb,
            niveau: f.properties.dern_valeur_niv,
            dateUtc: f.properties.dern_date_prise_valeur_utc
          });
        });
      })
      .catch(function (err) {
        console.error("Impossible de charger les donnees hydrometriques en temps reel:", err);
        hydroStationsMap = new Map();
      });
  }

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise(function (resolve) {
        setTimeout(function () {
          console.warn("Une source de donnees met trop de temps a repondre, poursuite sans elle.");
          resolve();
        }, ms);
      })
    ]);
  }

  // ===================================================================
  // APP BOOTSTRAP — load régions + sites in parallel, build the marker
  // and polyline for each site, then render the sidebar and the map.
  // Wrapped so that if map-only display code fails, the sidebar list
  // (already rendered) still stays usable.
  // ===================================================================
  Promise.all([
    withTimeout(fetchAdminRegions(), 6000),
    withTimeout(fetchHydroStations(), 8000),
    fetchSites()
  ])
    .then(function (results) {
      const geojson = results[2];
      allSites = geojson.features || [];

      allSites.forEach(function (site) {
        try {
          let latlngs = null;
          let midpointSource = null;

          if (site.geometry.type === "LineString") {
            const filtered = toLatLngsFiltered(site.geometry.coordinates);
            if (filtered.length >= 2) {
              latlngs = filtered;
              midpointSource = filtered;
            }
          } else if (site.geometry.type === "MultiLineString") {
            const parts = site.geometry.coordinates
              .map(toLatLngsFiltered)
              .filter(function (part) { return part.length >= 2; });
            if (parts.length > 0) {
              latlngs = parts;
              midpointSource = parts[0];
            }
          }

          if (!latlngs || !midpointSource) {
            console.warn("Geometrie invalide ou hors limites, site ignore:", site.properties.NOM || site.properties.OBJECTID);
            return;
          }

          const siteName = site.properties.NOM || site.properties.NOM_PLN_EAU || "Section sans nom";

          site._line = L.polyline(latlngs, {
            color: LINE_COLOR,
            weight: 3,
            opacity: 0.9
          });
          site._line.bindTooltip(siteName, { sticky: true });
          site._line.on("click", function (e) {
            L.DomEvent.stopPropagation(e);
            focusSite(site);
          });
          site._line.on("mouseover", function () {
            showHoverHighlight(site);
          });
          site._line.on("mouseout", function () {
            clearHoverHighlight();
          });

          const midLatLng = lineMidpoint(midpointSource);

          site._marker = L.marker(midLatLng, { icon: greenDotIcon() });
          site._marker.bindTooltip(siteName);
          site._marker.on("click", function (e) {
            L.DomEvent.stopPropagation(e);
            focusSite(site);
          });
          site._marker.on("mouseover", function () {
            showHoverHighlight(site);
          });
          site._marker.on("mouseout", function () {
            clearHoverHighlight();
          });

          const region = findRegionForLatLng(midLatLng);
          site._regionCode = region ? region.code : NO_REGION_KEY;
        } catch (e) {
          console.warn("Erreur de traitement pour un site, ignore:", site.properties && (site.properties.NOM || site.properties.OBJECTID), e);
        }
      });

      allSites = allSites.filter(function (s) { return !!s._marker && !!s._line; });

      allSites.sort(function (a, b) {
        const nameA = (a.properties.NOM_PLN_EAU || "") + (a.properties.NOM || "");
        const nameB = (b.properties.NOM_PLN_EAU || "") + (b.properties.NOM || "");
        return nameA.localeCompare(nameB);
      });

      regionLabels = {};
      adminRegions.forEach(function (r) { regionLabels[r.code] = r.name; });
      regionLabels[NO_REGION_KEY] = "Region non determinee";

      buildRegionMap();

      siteCountEl.textContent = allSites.length + " site(s)";
      renderGroupedList();

      // The list above is now safely rendered. Anything past this point is
      // purely visual (map styling/positioning) - wrap it so a failure here
      // can never wipe out the sidebar list that already rendered correctly.
      try {
        applyRegionStyles();
        refreshDisplay();
        map.fitBounds(safeGroupBounds(regionsLayerGroup, QC_FALLBACK_BOUNDS), { padding: [40, 40] });
      } catch (e) {
        console.error("Erreur lors de l'affichage initial de la carte (la liste reste fonctionnelle):", e);
      }
    })
    .catch(function (err) {
      siteListEl.innerHTML = '<div class="site-empty">Erreur lors du chargement des sites.</div>';
      console.error(err);
    });

  // ===================================================================
  // SEARCH BOX
  // ===================================================================
  searchBoxEl.addEventListener("input", function () {
    clearHighlight();
    if (activeItemEl) {
      activeItemEl.classList.remove("active");
      activeItemEl = null;
    }

    searchQuery = searchBoxEl.value.trim().toLowerCase();
    activeRegionCode = null;
    applyRegionStyles();

    if (!searchQuery) {
      renderGroupedList();
      refreshDisplay();
      flyToBoundsSafe(safeGroupBounds(regionsLayerGroup, QC_FALLBACK_BOUNDS));
      return;
    }

    const filtered = allSites.filter(siteMatchesSearch);
    renderFlatList(filtered);
    refreshDisplay();
    if (filtered.length > 0) {
      flyToBoundsSafe(boundsForSites(filtered, QC_FALLBACK_BOUNDS));
    }
  });
</script>

</body>
</html>
